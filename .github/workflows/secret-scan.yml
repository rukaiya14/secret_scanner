name: Secret Scanner with Slack Notifications

on:
  push:
    branches: [ main, master, develop, test-secret-detection ]
  pull_request:
    branches: [ main, master, develop, test-secret-detection ]

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for pull request diffs
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Use 3.11 for better compatibility
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install regex openpyxl requests
    
    - name: Run secret scanner with Slack notifications
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          python scan_and_notify_slack.py \
            --mode pull_request \
            --base-ref ${{ github.base_ref }} \
            --repo-name "${{ github.repository }}" \
            --branch "${{ github.head_ref }}"
        else
          python scan_and_notify_slack.py \
            --mode push \
            --repo-name "${{ github.repository }}" \
            --branch "${{ github.ref_name }}"
        fi
    
    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: secret-scan-results
        path: |
          scan_results.json
        retention-days: 30


