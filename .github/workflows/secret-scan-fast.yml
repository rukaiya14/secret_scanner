name: Fast Secret Scanner (Regex Only)

on:
  push:
    branches: [ main, master, develop, test-secret-detection ]
  pull_request:
    branches: [ main, master, develop, test-secret-detection ]

jobs:
  scan-secrets-fast:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install regex openpyxl requests
    
    - name: Run fast secret scanner
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          python scan_and_notify_slack.py \
            --mode pull_request \
            --base-ref ${{ github.base_ref }} \
            --repo-name "${{ github.repository }}" \
            --branch "${{ github.head_ref }}"
        else
          python scan_and_notify_slack.py \
            --mode push \
            --repo-name "${{ github.repository }}" \
            --branch "${{ github.ref_name }}"
        fi
      continue-on-error: false  # Fail the workflow if secrets are found
    
    - name: Comment on PR (if secrets found)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚨 **Secret Scanner Alert**\n\nHigh-confidence secrets were detected in this pull request. Please check the Slack notification for details and remove all secrets before merging.\n\n**Next Steps:**\n1. Check the #secret-scanner-alerts Slack channel\n2. Remove all detected secrets\n3. Rotate any compromised credentials\n4. Push your changes and re-run the scanner'
          })

